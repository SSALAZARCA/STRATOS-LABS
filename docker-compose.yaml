version: '3.8'

services:
  # 1. Database - MySQL
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: stratos_labs
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-stratos_root_123}
    # Internal port only to avoid conflicts on host
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_schema.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Backend - Node.js API
  backend:
    build:
      context: ./server
    restart: always
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-stratos_root_123}
      DB_NAME: stratos_labs
    depends_on:
      - db
    ports:
      - "3001:3001"

  # 3. Frontend - Vite + Nginx
  frontend:
    build:
      context: .
      args:
        - VITE_API_URL=http://${VPS_IP:-localhost}:3001/api
        - VITE_ADMIN_USER=${VITE_ADMIN_USER:-santiago.salazar}
        - VITE_ADMIN_PASSWORD=${VITE_ADMIN_PASSWORD:-ssc841209}
    restart: always
    ports:
      - "10500:80"
    depends_on:
      - backend

volumes:
  mysql_data:
